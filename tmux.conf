# prefix key is "CTRL-j"
set -g prefix C-j

set -g display-panes-time 10000
set-window-option -g mode-keys vi

# larger scrollback (default 2000 is too small for long CLI/AI output)
set -g history-limit 50000

# make Esc respond immediately (vim / Claude Code interrupt)
set -s escape-time 10

# mouse: wheel scrollback, drag to select (enters copy-mode-vi)
set -g mouse on

# allow programs inside tmux to set the clipboard via OSC 52
set -s set-clipboard on

# pass escape sequences (notifications, progress bars) through to the outer terminal
set -g allow-passthrough on

# share clipboard (with vim like key bind)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
if-shell "uname | grep -q Linux" {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy"
} {
  bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
  bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
}

# open window and pane inheriting from the current directory
bind-key c new-window -c '#{pane_current_path}'
bind-key % split-window -h -c '#{pane_current_path}'
bind-key '"' split-window -v -c '#{pane_current_path}'

# move between panes with vim like key bind
# (note: this shadows the default prefix+l = last-window)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# resize pane with vim like key bind
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# status bar (Tokyo Night Storm: dark base + accent chips, matches the zsh prompt)
set-option -g status-interval 5
set-option -g status-justify left
set-option -g status-style "bg=#24283b,fg=#c0caf5"

# left: no session name (single "main" session always) — start at the window list
set-option -g status-left ''
set-option -g status-left-length 0

# windows: current = purple bold text, others = muted gray. Foreground only
# (flat on the dark bar, no fill) to match the prompt's no-block style.
# #F shows flags (* current, - last, Z zoomed).
set-option -g window-status-separator ''
set-option -g window-status-style 'fg=#565f89,bg=#24283b'
set-option -g window-status-current-style 'fg=#bb9af7,bg=#24283b,bold'
set-option -g window-status-format ' #I #W#F '
set-option -g window-status-current-format ' #I #W#F '

# highlight windows that rang the bell (e.g. Claude Code finished a task)
set-option -g window-status-bell-style 'fg=#f7768e,bg=#24283b,bold'

# second status row: per-window dashboard. Scans ALL panes in each window
# (#{P:...} inside #{W:...}) and shows every pane title that is meaningful —
# i.e. not empty and not just the hostname (the tmux default) — so a Claude
# Code pane's task title shows even when another pane is focused. Windows
# with no titled pane are hidden from this row entirely.
# Bell windows turn red, entries are clickable.
set-option -g status 2
set-option -g status-format[1] '#[fill=#24283b]#[bg=#24283b]#{W:#{?#{P:#{?#{||:#{==:#{pane_title},},#{||:#{==:#{pane_title},#{host_short}},#{==:#{pane_title},#{host}}}},,#{pane_title} }},#[range=window|#{window_index}]#{?window_bell_flag,#[fg=#f7768e]#[bold],#[fg=#565f89]} #I #{P:#{?#{||:#{==:#{pane_title},},#{||:#{==:#{pane_title},#{host_short}},#{==:#{pane_title},#{host}}}},,#{pane_title} }}#[nobold]#[norange] ,},#{?#{P:#{?#{||:#{==:#{pane_title},},#{||:#{==:#{pane_title},#{host_short}},#{==:#{pane_title},#{host}}}},,#{pane_title} }},#[range=window|#{window_index}]#[fg=#bb9af7]#[bold] #I #[nobold]#[fg=#c0caf5]#{P:#{?#{||:#{==:#{pane_title},},#{||:#{==:#{pane_title},#{host_short}},#{==:#{pane_title},#{host}}}},,#{pane_title} }}#[norange] ,}}'

# right:  path  │  host  │  date time   (~ substitution via tmux format, no shell)
set-option -g status-right-length 80
set-option -g status-right '#[fg=#7dcfff]  #{s|^/Users/kohayagawa|~|:pane_current_path} #[fg=#414868]│#[fg=#9ece6a] #H #[fg=#414868]│#[fg=#e0af68] %Y-%m-%d #[fg=#7aa2f7]%H:%M '

# command line / copy-mode selection colors
set-option -g message-style "bg=#bb9af7,fg=#1f2335"
set-option -g mode-style    "bg=#3d59a1,fg=#c0caf5"

# true color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# focus-events
set-option -g focus-events on
